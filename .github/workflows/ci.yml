# Checks that hold without any hardware.
#
# Everything here runs on a machine with no GPU, no RDMA device and no vendor
# SDK. That is deliberate: the parts of this library that need hardware are
# tested on the machines that have it, and a pipeline that could only run
# there would check nothing on most changes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core and mock, no hardware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # No backend is enabled. If this ever needs one, the dependency has
        # crept into code that is supposed to build anywhere.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # A job count rather than a bare -j, which means unlimited: thirty
        # translation units compiling at once on a two-core runner with 7 GB
        # is a memory limit waiting to be found.
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Test again, under contention
        # Races do not need repetition to surface, they need contention, and
        # a runner with two cores has plenty of it. Two failures in the first
        # sixty-three runs came from one -- a request was counted after the
        # caller waiting on it had been released -- and running the suite
        # once could not find it. Eight copies at once could, three times in
        # forty.
        #
        # Cheap enough to keep: the suite takes three seconds.
        run: |
          for round in 1 2 3 4 5; do
            for k in 1 2 3 4 5 6 7 8; do
              ./build/tests/hux_contract_tests > "/tmp/par_$k.log" 2>&1 &
            done
            wait
            for k in 1 2 3 4 5 6 7 8; do
              if ! grep -q ", 0 failed" "/tmp/par_$k.log"; then
                echo "round $round, instance $k:"
                cat "/tmp/par_$k.log"
                exit 1
              fi
            done
          done
          echo "40 runs under contention, all passed"

  missing-dependency:
    name: enabling an absent backend fails at configure time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: UCX is not installed, so this must fail
        # A build that quietly comes out without the transport it was asked
        # for is worse than one that refuses, so the refusal is tested.
        run: |
          if cmake -S . -B build-ucx -DHUX_ENABLE_UCX=ON 2>err.txt; then
            echo "configure succeeded without UCX installed"
            exit 1
          fi
          grep -q "UCX was not found" err.txt

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nanobind
        run: pip install nanobind

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHUX_BUILD_PYTHON=ON
          cmake --build build -j
          PYTHONPATH=build python tests/python/test_bindings.py

  format:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        # Pinned: versions disagree on details, and a range would mean
        # whoever ran last decides the diff.
        run: pip install clang-format==14.0.6

      - name: Check
        # Reports and fails; it must not leave a modified tree behind.
        run: ./format.sh --check
